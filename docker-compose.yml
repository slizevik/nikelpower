version: '3.8'

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: nikelpower_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/nikelpower2026
      - NEO4J_dbms_memory_heap_max__size=512m
      - NEO4J_dbms_memory_pagecache_size=256m
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - nikelpower_neo4j_data:/data
      - nikelpower_neo4j_logs:/logs
    restart: unless-stopped

volumes:
  nikelpower_neo4j_data:
  nikelpower_neo4j_logs:
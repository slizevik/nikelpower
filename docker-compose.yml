services:
  neo4j:
    image: neo4j:5.26-community
    container_name: nikelpower_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-nikelpower2026}
      - NEO4J_dbms_memory_heap_max__size=${NEO4J_HEAP:-2G}
      - NEO4J_dbms_memory_pagecache_size=${NEO4J_PAGECACHE:-2G}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - nikelpower_neo4j_data:/data
      - nikelpower_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nikelpower_redis
    ports:
      - "6379:6379"
    volumes:
      - nikelpower_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    profiles:
      - worker

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nikelpower_backend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_URL=redis://redis:6379/0
      - DOCUMENTS_DIR=/data/documents
      - INGESTION_STATE_DIR=/data/ingestion
    volumes:
      - ./data/documents:/data/documents:ro
      - ./data/ingestion:/data/ingestion
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: nikelpower_worker
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_URL=redis://redis:6379/0
      - DOCUMENTS_DIR=/data/documents
      - INGESTION_STATE_DIR=/data/ingestion
    volumes:
      - ./data/documents:/data/documents:ro
      - ./data/ingestion:/data/ingestion
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - worker

  # Тестовый контейнер Graphiti + Yandex (profile graphiti, не стартует по умолчанию)
  graphiti:
    build:
      context: ./backend
      dockerfile: Dockerfile.graphiti
    container_name: nikelpower_graphiti
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - INGESTION_STATE_DIR=/data/ingestion
    volumes:
      - ./data/ingestion:/data/ingestion
    depends_on:
      neo4j:
        condition: service_healthy
    profiles:
      - graphiti

volumes:
  nikelpower_neo4j_data:
  nikelpower_neo4j_logs:
  nikelpower_redis_data:
